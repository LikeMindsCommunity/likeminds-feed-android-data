plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

ext {
    PUBLISH_GROUP_ID = 'community.likeminds'
    PUBLISH_VERSION = "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"
    PUBLISH_ARTIFACT_ID = 'likemindsfeed'
}

apply from: '../publish-helper.gradle'

android {
    namespace 'com.likeminds.likemindsfeed'
    compileSdk versions.compile_sdk

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
            manifestPlaceholders = [sentryEnvironment: "feedsdk-beta", releaseVersion: "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            manifestPlaceholders = [sentryEnvironment: "feedsdk-production", releaseVersion: "$versions.sdk_version_major.$versions.sdk_version_minor.$versions.sdk_version_patch"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
}

apply from: "likemindsfeed-dependencies.gradle"